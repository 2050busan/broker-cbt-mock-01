
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>2027년도 제37회 공인중개사 국가자격시험 실전 CBT 모의고사</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef2f7;
font-family:
-apple-system,
BlinkMacSystemFont,
"Apple SD Gothic Neo",
"Noto Sans KR",
sans-serif;
color:#111827;
}

.header{
position:sticky;
top:0;
z-index:999;
background:white;
border-bottom:1px solid #dbe3f1;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.inner{
max-width:1400px;
margin:auto;
padding:14px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
}

.title small{
display:block;
font-size:13px;
font-weight:800;
color:#667085;
}

.title h1{
margin:4px 0 0;
font-size:28px;
font-weight:950;
letter-spacing:-1px;
}

.badge{
display:inline-flex;
padding:5px 12px;
background:#eff6ff;
border-radius:999px;
font-size:12px;
font-weight:900;
color:#2563eb;
margin-left:8px;
}

.timer{
background:#111827;
color:white;
padding:12px 22px;
border-radius:20px;
text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,.18);
}

.timer small{
display:block;
color:#cbd5e1;
font-weight:700;
font-size:12px;
}

.timer b{
font-size:28px;
letter-spacing:1px;
}

.hero{
max-width:1200px;
margin:24px auto;
padding:0 14px;
}

.heroCard{
background:white;
border-radius:30px;
padding:28px;
box-shadow:0 16px 40px rgba(0,0,0,.08);
border:1px solid #dbe3f1;
}

.heroCard h2{
margin:0;
font-size:36px;
font-weight:950;
line-height:1.3;
letter-spacing:-1px;
}

.heroCard p{
margin-top:10px;
color:#667085;
font-size:16px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-top:20px;
}

.box{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:20px;
padding:18px;
text-align:center;
}

.box small{
display:block;
font-size:12px;
font-weight:800;
color:#667085;
}

.box b{
display:block;
margin-top:8px;
font-size:28px;
font-weight:950;
}

.nickname{
width:100%;
margin-top:20px;
padding:16px;
font-size:18px;
font-weight:800;
border-radius:18px;
border:1px solid #d0d5dd;
}

.btns{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:18px;
}

button{
border:none;
cursor:pointer;
font-weight:950;
border-radius:18px;
padding:18px;
font-size:18px;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.primary{
background:#2563eb;
color:white;
}

.dark{
background:#111827;
color:white;
}

.wrap{
max-width:1400px;
margin:auto;
padding:14px;
display:grid;
grid-template-columns:1fr 320px;
gap:14px;
}

.paper{
background:white;
border-radius:28px;
overflow:hidden;
border:1px solid #dbe3f1;
box-shadow:0 14px 36px rgba(0,0,0,.08);
}

.paperTop{
padding:24px;
border-bottom:1px solid #edf1f7;
background:#fafafa;
}

.paperTop h2{
margin:0;
font-size:24px;
font-weight:950;
}

.paperTop p{
margin-top:6px;
font-size:13px;
color:#667085;
font-weight:700;
}

.qcard{
padding:24px;
border-bottom:1px solid #eef2f6;
}

.meta{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.meta span{
font-size:11px;
font-weight:900;
padding:4px 8px;
background:#eff6ff;
color:#2563eb;
border-radius:999px;
}

.qtitle{
font-size:18px;
font-weight:900;
line-height:1.7;
letter-spacing:-.3px;
margin-bottom:14px;
}

.choice{
display:flex;
gap:12px;
align-items:flex-start;
padding:16px;
border-radius:18px;
border:1px solid #d0d5dd;
margin:10px 0;
cursor:pointer;
transition:.2s;
font-size:16px;
line-height:1.6;
background:white;
}

.choice:hover{
border-color:#2563eb;
background:#eff6ff;
}

.choice input{
transform:scale(1.2);
margin-top:4px;
}

.choice:has(input:checked){
background:#eff6ff;
border-color:#2563eb;
}

.num{
font-weight:950;
min-width:22px;
}

.analysis{
display:none;
margin-top:14px;
padding:16px;
border-radius:18px;
background:#f8fafc;
border:1px dashed #cbd5e1;
font-size:15px;
line-height:1.7;
}

.checked .analysis{
display:block;
}

.correct{
background:#dcfce7 !important;
border-color:#16a34a !important;
}

.wrong{
background:#fee2e2 !important;
border-color:#dc2626 !important;
}

.side{
position:sticky;
top:110px;
height:fit-content;
}

.panel{
background:white;
border-radius:24px;
padding:18px;
border:1px solid #dbe3f1;
box-shadow:0 14px 36px rgba(0,0,0,.08);
}

.panel h3{
margin:0 0 12px;
font-size:18px;
font-weight:950;
}

.omr{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.omr button{
padding:10px;
font-size:13px;
border-radius:12px;
background:white;
border:1px solid #d0d5dd;
font-weight:900;
}

.done{
background:#eff6ff !important;
border-color:#93c5fd !important;
color:#2563eb;
}

.good{
background:#dcfce7 !important;
border-color:#16a34a !important;
color:#166534 !important;
}

.bad{
background:#fee2e2 !important;
border-color:#dc2626 !important;
color:#991b1b !important;
}

.result{
margin-top:14px;
padding:16px;
border-radius:18px;
background:#f8fafc;
border:1px solid #e5e7eb;
line-height:1.8;
font-size:14px;
}

.hidden{
display:none !important;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr 1fr;
}

.wrap{
display:block;
}

.side{
position:static;
margin-top:16px;
}

.omr{
grid-template-columns:repeat(10,1fr);
}

.title h1{
font-size:22px;
}

.heroCard h2{
font-size:28px;
}

.choice{
font-size:15px;
padding:14px;
}

}

</style>
</head>

<body>

<header class="header">
<div class="inner">

<div class="top">

<div class="title">

<small>
2027년도 제37회 공인중개사 국가자격시험
</small>

<h1>
실전 CBT 모의고사
<span class="badge hidden" id="nicknameBadge"></span>
</h1>

</div>

<div class="timer">
<small>남은 시간</small>
<b id="timer">--:--</b>
</div>

</div>

</div>
</header>

<section class="hero" id="landing">

<div class="heroCard">

<h2>
2027년도 제37회 공인중개사 국가자격시험<br>
실전 CBT 모의고사
</h2>

<p>
실제 시험 스타일 기반 · 실전 압박형 CBT
</p>

<div class="grid">

<div class="box">
<small>1차</small>
<b>100분</b>
</div>

<div class="box">
<small>2차</small>
<b>150분</b>
</div>

<div class="box">
<small>문항</small>
<b>200</b>
</div>

<div class="box">
<small>방식</small>
<b>5지선다</b>
</div>

</div>

<input
class="nickname"
id="nickname"
placeholder="닉네임 입력"
/>

<div class="btns">

<button
class="primary"
onclick="startExam('1차')"
>
1차 시작
</button>

<button
class="dark"
onclick="startExam('2차')"
>
2차 시작
</button>

</div>

</div>

</section>

<main class="wrap hidden" id="examWrap">

<section class="paper">

<div class="paperTop">

<h2 id="examTitle">
실전 CBT
</h2>

<p id="examDesc">
실제 시험 스타일 기반
</p>

</div>

<div id="questions"></div>

</section>

<aside class="side">

<div class="panel">

<h3>실시간 OMR</h3>

<div class="omr" id="omr"></div>

<div class="result" id="result">
시험 진행 중입니다.
</div>

</div>

</aside>

</main>

<script>

let questions = [];

function createQuestion(subject, idx){

return {
exam:
subject==="부동산학개론" ||
subject==="민법 및 민사특별법"
?
"1차"
:
"2차",

subject,

q:
idx +
". 다음 설명 중 가장 옳지 않은 것은?",

choices:[
"관련 법령 및 판례에 비추어 볼 때 타당한 설명이다.",
"실무상 일반적으로 인정되는 내용이다.",
"최근 기출 판례의 입장과 동일한 설명이다.",
"관련 규정의 예외사유에 해당할 수 있다.",
"법령 및 판례상 명백히 타당하다고 보기 어렵다."
],

answer:5,

analysis:
"실전형 함정 선지 구조입니다. 실제 시험에서는 예외규정·판례 문구·숫자 함정 중심으로 출제됩니다."

};

}

for(let i=1;i<=40;i++){
questions.push(createQuestion("부동산학개론",i));
}

for(let i=1;i<=40;i++){
questions.push(createQuestion("민법 및 민사특별법",i));
}

for(let i=1;i<=40;i++){
questions.push(createQuestion("중개사법",i));
}

for(let i=1;i<=40;i++){
questions.push(createQuestion("공법",i));
}

for(let i=1;i<=24;i++){
questions.push(createQuestion("공시법",i));
}

for(let i=1;i<=16;i++){
questions.push(createQuestion("세법",i));
}

const questionsDiv =
document.getElementById("questions");

questions.forEach((q,i)=>{

questionsDiv.innerHTML += `

<div
class="qcard"
id="q${i+1}"
data-exam="${q.exam}"
>

<div class="meta">
<span>${q.exam}</span>
<span>${q.subject}</span>
<span>실전형</span>
</div>

<div class="qtitle">
${i+1}. ${q.q}
</div>

${q.choices.map((c,idx)=>`

<label
class="choice"
id="q${i+1}c${idx+1}"
>

<input
type="radio"
name="q${i+1}"
value="${idx+1}"
>

<div class="num">
${idx+1}
</div>

<div>
${c}
</div>

</label>

`).join("")}

<div class="analysis">
<b>해설</b><br>
${q.analysis}
</div>

</div>

`;

});

let currentExam = "";
let totalSeconds = 0;
let timer;

function startExam(type){

currentExam = type;

document
.getElementById("landing")
.classList.add("hidden");

document
.getElementById("examWrap")
.classList.remove("hidden");

const nickname =
document
.getElementById("nickname")
.value;

if(nickname){

const badge =
document
.getElementById("nicknameBadge");

badge.innerHTML =
"응시자 : " + nickname;

badge.classList.remove("hidden");

}

if(type==="1차"){

totalSeconds = 100 * 60;

document
.getElementById("examTitle")
.innerHTML =
"1차 실전 CBT 모의고사";

document
.getElementById("examDesc")
.innerHTML =
"부동산학개론 + 민법 및 민사특별법";

}else{

totalSeconds = 150 * 60;

document
.getElementById("examTitle")
.innerHTML =
"2차 실전 CBT 모의고사";

document
.getElementById("examDesc")
.innerHTML =
"중개사법 + 공법 + 공시법 + 세법";

}

document
.querySelectorAll(".qcard")
.forEach(card=>{

if(
card.dataset.exam===type
){

card.classList.remove("hidden");

}else{

card.classList.add("hidden");

}

});

renderOMR();

updateTimer();

timer =
setInterval(updateTimer,1000);

}

function updateTimer(){

let m =
Math.floor(totalSeconds/60);

let s =
totalSeconds%60;

document
.getElementById("timer")
.innerHTML =
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

if(totalSeconds<=0){

gradeExam();

}

totalSeconds--;

}

function renderOMR(){

const omr =
document.getElementById("omr");

omr.innerHTML = "";

document
.querySelectorAll(".qcard:not(.hidden)")
.forEach((card,idx)=>{

omr.innerHTML += `
<button onclick="
document
.getElementById('${card.id}')
.scrollIntoView({
behavior:'smooth'
})
">
${idx+1}
</button>
`;

});

}

function gradeExam(){

clearInterval(timer);

let total = 0;
let correct = 0;

document
.querySelectorAll(".qcard:not(.hidden)")
.forEach((card,idx)=>{

total++;

const q =
questions[idx];

const checked =
card.querySelector("input:checked");

card.classList.add("checked");

document
.getElementById(
"q"+(idx+1)+"c"+q.answer
)
.classList.add("correct");

if(checked){

if(
Number(checked.value)
===
q.answer
){

correct++;

}else{

checked
.parentElement
.classList
.add("wrong");

}

}

});

let score =
Math.round(correct/total*100);

document
.getElementById("result")
.innerHTML =
`
<b>채점 결과</b><br>
총점 : ${score}점<br>
정답 : ${correct}/${total}<br><br>
${
score>=85
?
"상위 합격권"
:
score>=70
?
"합격권"
:
score>=60
?
"불안한 합격권"
:
"위험권"
}
`;

}

window.onbeforeunload =
function(){

return "시험이 진행 중입니다.";

}

</script>

</body>
</html>
