<!-- ===================================================== -->
<!-- 2027 제37회 공인중개사 실전 CBT PREMIUM -->
<!-- index.html 전체 교체용 -->
<!-- 반복생성 제거 / 개별 문제 구조 -->
<!-- ===================================================== -->

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>2027 제37회 공인중개사 실전 CBT PREMIUM</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#eef2f7;
font-family:
-apple-system,
BlinkMacSystemFont,
"Apple SD Gothic Neo",
"Noto Sans KR",
sans-serif;
color:#111827;
}

.header{
position:sticky;
top:0;
z-index:999;
background:white;
border-bottom:1px solid #dbe3f1;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.inner{
max-width:1450px;
margin:auto;
padding:14px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
}

.title small{
display:block;
font-size:13px;
font-weight:900;
color:#667085;
}

.title h1{
margin:4px 0 0;
font-size:28px;
font-weight:950;
letter-spacing:-1px;
}

.badge{
display:inline-flex;
padding:5px 12px;
background:#eff6ff;
border-radius:999px;
font-size:12px;
font-weight:950;
color:#2563eb;
margin-left:8px;
}

.timer{
background:#111827;
color:white;
padding:12px 22px;
border-radius:18px;
text-align:center;
}

.timer small{
display:block;
font-size:12px;
color:#cbd5e1;
}

.timer b{
font-size:28px;
font-weight:950;
}

.hero{
max-width:1200px;
margin:24px auto;
padding:0 14px;
}

.heroCard{
background:white;
border-radius:28px;
padding:28px;
border:1px solid #dbe3f1;
box-shadow:0 16px 36px rgba(0,0,0,.08);
}

.heroCard h2{
margin:0;
font-size:36px;
font-weight:950;
line-height:1.3;
}

.heroCard p{
margin-top:10px;
font-size:15px;
font-weight:700;
color:#667085;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-top:20px;
}

.box{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:18px;
padding:18px;
text-align:center;
}

.box small{
display:block;
font-size:12px;
font-weight:800;
color:#667085;
}

.box b{
display:block;
margin-top:8px;
font-size:26px;
font-weight:950;
}

.nickname{
width:100%;
margin-top:18px;
padding:16px;
font-size:18px;
font-weight:800;
border-radius:18px;
border:1px solid #d0d5dd;
}

.btns{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:18px;
}

button{
border:none;
cursor:pointer;
font-weight:950;
border-radius:18px;
padding:18px;
font-size:18px;
}

.primary{
background:#2563eb;
color:white;
}

.dark{
background:#111827;
color:white;
}

.wrap{
max-width:1450px;
margin:auto;
padding:14px;
display:grid;
grid-template-columns:1fr 320px;
gap:14px;
}

.paper{
background:white;
border-radius:28px;
overflow:hidden;
border:1px solid #dbe3f1;
}

.paperTop{
padding:24px;
border-bottom:1px solid #edf1f7;
background:#fafafa;
}

.paperTop h2{
margin:0;
font-size:24px;
font-weight:950;
}

.paperTop p{
margin-top:6px;
font-size:13px;
font-weight:700;
color:#667085;
}

.qcard{
padding:24px;
border-bottom:1px solid #eef2f6;
}

.meta{
display:flex;
gap:6px;
flex-wrap:wrap;
margin-bottom:10px;
}

.meta span{
font-size:11px;
font-weight:950;
padding:4px 8px;
background:#eff6ff;
color:#2563eb;
border-radius:999px;
}

.qtitle{
font-size:18px;
font-weight:900;
line-height:1.7;
margin-bottom:14px;
}

.choice{
display:flex;
gap:12px;
align-items:flex-start;
padding:16px;
border-radius:18px;
border:1px solid #d0d5dd;
margin:10px 0;
cursor:pointer;
font-size:16px;
line-height:1.6;
background:white;
}

.choice:hover{
border-color:#2563eb;
background:#eff6ff;
}

.choice input{
transform:scale(1.2);
margin-top:4px;
}

.choice:has(input:checked){
background:#eff6ff;
border-color:#2563eb;
}

.num{
font-weight:950;
min-width:22px;
}

.analysis{
display:none;
margin-top:14px;
padding:16px;
border-radius:18px;
background:#f8fafc;
border:1px dashed #cbd5e1;
font-size:15px;
line-height:1.7;
}

.checked .analysis{
display:block;
}

.correct{
background:#dcfce7 !important;
border-color:#16a34a !important;
}

.wrong{
background:#fee2e2 !important;
border-color:#dc2626 !important;
}

.side{
position:sticky;
top:110px;
height:fit-content;
}

.panel{
background:white;
border-radius:24px;
padding:18px;
border:1px solid #dbe3f1;
}

.omr{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.omr button{
padding:10px;
font-size:13px;
border-radius:12px;
background:white;
border:1px solid #d0d5dd;
font-weight:950;
}

.result{
margin-top:14px;
padding:16px;
border-radius:18px;
background:#f8fafc;
border:1px solid #e5e7eb;
line-height:1.8;
font-size:14px;
}

.hidden{
display:none !important;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr 1fr;
}

.wrap{
display:block;
}

.side{
position:static;
margin-top:16px;
}

.omr{
grid-template-columns:repeat(10,1fr);
}

.heroCard h2{
font-size:28px;
}

.choice{
font-size:15px;
padding:14px;
}

}

</style>
</head>

<body>

<header class="header">

<div class="inner">

<div class="top">

<div class="title">

<small>
2027년도 제37회 공인중개사 국가자격시험
</small>

<h1>
실전 CBT PREMIUM
<span class="badge hidden" id="nicknameBadge"></span>
</h1>

</div>

<div class="timer">
<small>남은 시간</small>
<b id="timer">--:--</b>
</div>

</div>

</div>

</header>

<section class="hero" id="landing">

<div class="heroCard">

<h2>
2027 제37회 공인중개사<br>
실전 CBT PREMIUM
</h2>

<p>
28~36회 기출 패턴 기반 · 실전 압박형 모의고사
</p>

<div class="grid">

<div class="box">
<small>1차</small>
<b>100분</b>
</div>

<div class="box">
<small>2차</small>
<b>150분</b>
</div>

<div class="box">
<small>문항</small>
<b>200</b>
</div>

<div class="box">
<small>방식</small>
<b>5지선다</b>
</div>

</div>

<input
class="nickname"
id="nickname"
placeholder="닉네임 입력"
/>

<div class="btns">

<button
class="primary"
onclick="startExam('1차')"
>
1차 시작
</button>

<button
class="dark"
onclick="startExam('2차')"
>
2차 시작
</button>

</div>

</div>

</section>

<main class="wrap hidden" id="examWrap">

<section class="paper">

<div class="paperTop">

<h2 id="examTitle"></h2>

<p id="examDesc"></p>

</div>

<div id="questions"></div>

</section>

<aside class="side">

<div class="panel">

<h3>실시간 OMR</h3>

<div class="omr" id="omr"></div>

<div class="result" id="result">
시험 진행 중입니다.
</div>

</div>

</aside>

</main>

<script>

/* ========================================= */
/* 실제 개별 문제 구조 */
/* 반복생성 제거 */
/* ========================================= */

const questions = [

{
exam:"1차",
subject:"민법 및 민사특별법",

q:"甲은 자신의 토지를 乙에게 매도하기로 계약하고 계약금까지 수령하였다. 이후 토지 가격이 급등하자 甲은 계약금을 반환하면서 계약을 해제하려 하였으나, 이미 乙은 중도금 일부를 지급하고 건축설계까지 마친 상태였다. 이에 관한 설명으로 가장 옳은 것은?",

choices:[
"乙이 건축설계를 마친 이상 이는 이행의 착수에 해당하므로 甲은 계약금을 반환하더라도 해제할 수 없다.",
"중도금 일부 지급은 이행의 착수로 볼 수 없으므로 甲은 언제든 해제 가능하다.",
"계약금 해제는 상대방 동의가 있어야만 가능하다.",
"계약금은 손해배상 예정액으로 추정되므로 해제권과는 무관하다.",
"甲은 시가상승을 이유로 사정변경 원칙에 따라 계약을 해제할 수 있다."
],

answer:1,

analysis:"계약금 해제는 이행의 착수 전까지만 가능하다. 최근 기출은 이행착수 판단을 사례형으로 길게 출제하는 경향이 강하다."

},

{
exam:"1차",
subject:"민법 및 민사특별법",

q:"통정허위표시에 관한 설명으로 가장 옳은 것은?",

choices:[
"통정허위표시는 취소 전까지 유효하다.",
"선의의 제3자에게는 무효를 대항하지 못한다.",
"악의의 제3자도 보호된다.",
"통정허위표시는 언제나 상대방의 동의 없이 철회 가능하다.",
"허위표시는 당사자 일방의 의사만으로 성립한다."
],

answer:2,

analysis:"민법 사례형 핵심 파트. 최근 회차에서 선의·악의·제3자 범위를 반복 출제."

},

{
exam:"2차",
subject:"공법",

q:"국토의 계획 및 이용에 관한 법령상 용도지역에 관한 설명으로 가장 옳지 않은 것은?",

choices:[
"용도지역은 토지의 이용 및 건축물의 용도 등을 제한하기 위하여 지정할 수 있다.",
"용도지역은 도시·군관리계획으로 결정할 수 있다.",
"하나의 토지에는 원칙적으로 둘 이상의 용도지역을 중복 지정할 수 있다.",
"용도지역은 토지이용의 효율화를 위한 제도이다.",
"용도지역은 공공복리 증진과 관련된다."
],

answer:3,

analysis:"용도지역·용도지구·용도구역 혼합 함정은 최근 공법 핵심 출제 패턴."

},

{
exam:"2차",
subject:"중개사법",

q:"공인중개사법령상 개업공인중개사의 금지행위에 관한 설명으로 가장 옳은 것은?",

choices:[
"거래완료된 매물을 계속 광고하는 것은 허용된다.",
"중개보조원은 단독으로 확인·설명을 할 수 있다.",
"법정 보수 한도를 초과하여 자유롭게 약정할 수 있다.",
"개업공인중개사는 법령상 금지행위를 하여서는 안 된다.",
"중개의뢰인과 직접 거래하는 행위는 원칙적으로 허용된다."
],

answer:4,

analysis:"중개사법은 광고규정·중개보조원·중개보수 함정을 결합해서 출제하는 경향이 강함."

},

{
exam:"2차",
subject:"세법",

q:"1세대 1주택 비과세에 관한 설명으로 가장 옳은 것은?",

choices:[
"주택 수·보유기간·거주기간 등이 문제될 수 있다.",
"1주택이면 언제나 비과세된다.",
"조정대상지역 여부는 고려되지 않는다.",
"미등기 자산도 동일하게 적용된다.",
"양도가액은 전혀 고려되지 않는다."
],

answer:1,

analysis:"최근 세법은 조정대상지역·장기보유특별공제·보유기간 함정을 반복 출제."

}

];

/* ========================================= */
/* 이하 CBT 엔진 */
/* ========================================= */

const questionsDiv =
document.getElementById("questions");

questions.forEach((q,i)=>{

questionsDiv.innerHTML += `

<div
class="qcard hidden"
id="q${i+1}"
data-exam="${q.exam}"
>

<div class="meta">
<span>${q.exam}</span>
<span>${q.subject}</span>
<span>실전형</span>
</div>

<div class="qtitle">
${i+1}. ${q.q}
</div>

${q.choices.map((c,idx)=>`

<label
class="choice"
id="q${i+1}c${idx+1}"
>

<input
type="radio"
name="q${i+1}"
value="${idx+1}"
>

<div class="num">
${idx+1}
</div>

<div>
${c}
</div>

</label>

`).join("")}

<div class="analysis">
<b>해설</b><br>
${q.analysis}
</div>

</div>

`;

});

let totalSeconds = 0;
let timer;

function startExam(type){

document
.getElementById("landing")
.classList.add("hidden");

document
.getElementById("examWrap")
.classList.remove("hidden");

const nickname =
document
.getElementById("nickname")
.value;

if(nickname){

const badge =
document
.getElementById("nicknameBadge");

badge.innerHTML =
"응시자 : " + nickname;

badge.classList.remove("hidden");

}

if(type==="1차"){

totalSeconds = 100*60;

document
.getElementById("examTitle")
.innerHTML =
"1차 실전 CBT";

document
.getElementById("examDesc")
.innerHTML =
"민법 및 민사특별법";

}else{

totalSeconds = 150*60;

document
.getElementById("examTitle")
.innerHTML =
"2차 실전 CBT";

document
.getElementById("examDesc")
.innerHTML =
"공법 · 중개사법 · 세법";

}

document
.querySelectorAll(".qcard")
.forEach(card=>{

if(card.dataset.exam===type){

card.classList.remove("hidden");

}else{

card.classList.add("hidden");

}

});

renderOMR();

updateTimer();

timer =
setInterval(updateTimer,1000);

}

function updateTimer(){

let m =
Math.floor(totalSeconds/60);

let s =
totalSeconds%60;

document
.getElementById("timer")
.innerHTML =
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

if(totalSeconds<=0){

gradeExam();

}

totalSeconds--;

}

function renderOMR(){

const omr =
document.getElementById("omr");

omr.innerHTML = "";

document
.querySelectorAll(".qcard:not(.hidden)")
.forEach((card,idx)=>{

omr.innerHTML += `
<button onclick="
document
.getElementById('${card.id}')
.scrollIntoView({
behavior:'smooth'
})
">
${idx+1}
</button>
`;

});

}

function gradeExam(){

clearInterval(timer);

let total = 0;
let correct = 0;

document
.querySelectorAll(".qcard:not(.hidden)")
.forEach(card=>{

total++;

const idx =
Number(
card.id.replace("q","")
)-1;

const q =
questions[idx];

const checked =
card.querySelector("input:checked");

card.classList.add("checked");

document
.getElementById(
"q"+(idx+1)+"c"+q.answer
)
.classList.add("correct");

if(checked){

if(
Number(checked.value)
===
q.answer
){

correct++;

}else{

checked
.parentElement
.classList
.add("wrong");

}

}

});

let score =
Math.round(correct/total*100);

document
.getElementById("result")
.innerHTML =
`
<b>채점 결과</b><br>
총점 : ${score}점<br>
정답 : ${correct}/${total}
`;

}

window.onbeforeunload =
function(){

return "시험이 진행 중입니다.";

}

</script>

</body>
</html>
