questions.forEach((q,i)=>{questionsDiv.innerHTML += `<div class="qcard hidden" id="q${i+1}" data-exam="${q.exam}" data-subject="${q.subject}"><div class="meta"><span>${q.exam}</span><span>${q.subject}</span><span>${q.topic}</span></div><div class="qtitle">${i+1}. ${q.q}</div>${q.choices.map((c,idx)=>`<label class="choice" id="q${i+1}c${idx+1}"><input type="radio" name="q${i+1}" value="${idx+1}"><div class="num">${idx+1}</div><div>${c}</div></label>`).join("")}<div class="analysis"><b>해설</b><br>${q.analysis}</div></div>`;});
let currentExam="",totalSeconds=0,timer=null,submitted=false;
function examSubjects(type){return type==="1차"?["부동산학개론","민법 및 민사특별법"]:["중개사법","공법","공시법","세법"];}
function startExam(type){currentExam=type;submitted=false;document.getElementById("landing").classList.add("hidden");document.getElementById("examWrap").classList.remove("hidden");const nickname=document.getElementById("nickname").value.trim();if(nickname){const badge=document.getElementById("nicknameBadge");badge.innerHTML="응시자 : "+nickname;badge.classList.remove("hidden");}if(type==="1차"){totalSeconds=100*60;document.getElementById("examTitle").innerHTML="1차 실전 CBT";document.getElementById("examDesc").innerHTML="부동산학개론 40문항 + 민법 및 민사특별법 40문항 = 총 80문항";}else{totalSeconds=150*60;document.getElementById("examTitle").innerHTML="2차 실전 CBT";document.getElementById("examDesc").innerHTML="중개사법 40 + 공법 40 + 공시법 24 + 세법 16 = 총 120문항";}document.querySelectorAll(".qcard").forEach(card=>{card.dataset.exam===type?card.classList.remove("hidden"):card.classList.add("hidden");});renderJumpButtons(type);renderOMR();updateTimer();timer=setInterval(updateTimer,1000);window.scrollTo(0,0);}
function renderJumpButtons(type){const wrap=document.getElementById("jumpButtons");wrap.innerHTML="";examSubjects(type).forEach(sub=>{wrap.innerHTML+=`<button onclick="jumpSubject('${sub}')">${sub}</button>`;})}
function jumpSubject(sub){const card=Array.from(document.querySelectorAll(".qcard:not(.hidden)")).find(c=>c.dataset.subject===sub);if(card)card.scrollIntoView({behavior:"smooth"});}
function updateTimer(){let m=Math.floor(totalSeconds/60),s=totalSeconds%60;document.getElementById("timer").innerHTML=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(totalSeconds<=0){gradeExam(true);return;}totalSeconds--;}
function visibleCards(){return Array.from(document.querySelectorAll(".qcard:not(.hidden)"));}
function renderOMR(){const omr=document.getElementById("omr");omr.innerHTML="";visibleCards().forEach((card,idx)=>{const checked=card.querySelector("input:checked");let cls=checked?"done":"";omr.innerHTML+=`<button class="${cls}" onclick="document.getElementById('${card.id}').scrollIntoView({behavior:'smooth'})">${idx+1}</button>`;});}
document.addEventListener("change",renderOMR);
function findBlank(){const blank=visibleCards().find(card=>!card.querySelector("input:checked"));if(blank)blank.scrollIntoView({behavior:"smooth"});else alert("미응답 문항이 없습니다.");}
function gradeExam(auto=false){if(submitted)return;if(!auto){const blanks=visibleCards().filter(card=>!card.querySelector("input:checked")).length;if(!confirm(`답안을 제출할까요? 미응답 ${blanks}개입니다. 제출 후 정답과 해설이 공개됩니다.`))return;}submitted=true;clearInterval(timer);let total=0,correct=0,blank=0;visibleCards().forEach(card=>{total++;const idx=Number(card.id.replace("q",""))-1;const q=questions[idx];const checked=card.querySelector("input:checked");card.classList.add("checked");document.getElementById("q"+(idx+1)+"c"+q.answer).classList.add("correct");if(!checked)blank++;else if(Number(checked.value)===q.answer)correct++;else checked.parentElement.classList.add("wrong");});let score=Math.round(correct/total*100);document.getElementById("result").innerHTML=`<b>채점 결과</b><br>${currentExam} 총점 : ${score}점<br>정답 : ${correct}/${total}<br>미응답 : ${blank}개<br><br>${score>=85?"상위 합격권":score>=70?"합격권":score>=60?"불안한 합격권":"위험권"}`;renderOMR();window.scrollTo(0,0);}
window.onbeforeunload=function(){if(!submitted&&currentExam)return "시험이 진행 중입니다.";}
</script>
</body>
